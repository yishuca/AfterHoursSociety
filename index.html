<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Realistic Smoke Trail - Universal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        body {
            background-color: #000;
            min-height: 100vh;
            overflow: hidden;
            cursor: default;
            touch-action: none;
        }
        
        /* Smoke particle - optimized for all devices */
        .smoke {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
        }
        
        /* Device-specific optimizations */
        @media (max-width: 768px) {
            body {
                touch-action: pan-x pan-y;
            }
        }
    </style>
</head>
<body>
    <script>
        // Performance detection and optimization
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isLowPerfDevice = (() => {
            if (isMobile) return true;
            const memory = navigator.deviceMemory;
            if (memory && memory < 4) return true;
            return false;
        })();
        
        // Performance-based settings
        const config = {
            maxParticles: isLowPerfDevice ? 40 : 80,
            particleSize: { min: 8, max: 25 },
            particleOpacity: { min: 0.08, max: 0.25 },
            particleDecay: { min: 0.01, max: 0.03 },
            framesPerSecond: isLowPerfDevice ? 24 : 30,
            mobileMultiplier: isMobile ? 0.6 : 1
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            const particles = [];
            let pointerX = window.innerWidth / 2;
            let pointerY = window.innerHeight / 2;
            let isPointerDown = false;
            let lastAnimationTime = 0;
            let frameInterval = 1000 / config.framesPerSecond;
            let rafId = null;
            
            // Pointer event handling for all devices
            function updatePointerPosition(x, y) {
                pointerX = x;
                pointerY = y;
                
                // Create smoke based on movement speed (to prevent over-creation)
                if (!isPointerDown) {
                    createSubtleSmoke(pointerX, pointerY);
                }
            }
            
            // Desktop mouse events
            document.addEventListener('mousemove', (e) => {
                updatePointerPosition(e.clientX, e.clientY);
            });
            
            // Touch events for mobile/tablet
            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    updatePointerPosition(touch.clientX, touch.clientY);
                    isPointerDown = true;
                    
                    // Create more smoke on touch drag
                    createTouchSmoke(touch.clientX, touch.clientY, 3);
                }
            }, { passive: false });
            
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    isPointerDown = true;
                    const touch = e.touches[0];
                    createTouchSmoke(touch.clientX, touch.clientY, 5);
                }
            });
            
            document.addEventListener('touchend', () => {
                isPointerDown = false;
            });
            
            document.addEventListener('touchcancel', () => {
                isPointerDown = false;
            });
            
            // Create subtle, realistic smoke
            function createSubtleSmoke(x, y, intensity = 1) {
                // Only create 1-2 particles for subtle movement
                const count = Math.floor(Math.random() * 2) + 1;
                
                for (let i = 0; i < count; i++) {
                    if (particles.length >= config.maxParticles) {
                        removeOldestParticle();
                    }
                    
                    createSingleSmokeParticle(x, y, intensity);
                }
            }
            
            // Create smoke for touch/more intense interaction
            function createTouchSmoke(x, y, count) {
                for (let i = 0; i < count; i++) {
                    if (particles.length >= config.maxParticles) {
                        removeOldestParticle();
                    }
                    
                    setTimeout(() => {
                        createSingleSmokeParticle(x, y, 1.5);
                    }, i * 20);
                }
            }
            
            function removeOldestParticle() {
                if (particles.length > 0) {
                    const oldest = particles.shift();
                    if (oldest.element && document.body.contains(oldest.element)) {
                        document.body.removeChild(oldest.element);
                    }
                }
            }
            
            function createSingleSmokeParticle(x, y, intensity = 1) {
                const particle = document.createElement('div');
                particle.classList.add('smoke');
                
                // Ultra-realistic sizing (smaller for realism)
                const size = Math.random() * 
                    (config.particleSize.max - config.particleSize.min) * 
                    config.mobileMultiplier + 
                    config.particleSize.min;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Ultra-realistic smoke colors (more transparent)
                const colorType = Math.random();
                let r, g, b;
                
                if (colorType < 0.4) {
                    // Cool gray smoke
                    r = g = Math.floor(Math.random() * 30 + 220);
                    b = Math.floor(Math.random() * 20 + 235);
                } else if (colorType < 0.7) {
                    // Warm smoke
                    r = Math.floor(Math.random() * 30 + 230);
                    g = Math.floor(Math.random() * 30 + 220);
                    b = Math.floor(Math.random() * 30 + 210);
                } else {
                    // Neutral smoke
                    r = g = b = Math.floor(Math.random() * 40 + 210);
                }
                
                // More transparent (ultra-realistic)
                const alpha = (Math.random() * 
                    (config.particleOpacity.max - config.particleOpacity.min) + 
                    config.particleOpacity.min) * intensity;
                
                particle.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                
                // Realistic offset
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 30 * config.mobileMultiplier;
                const offsetX = Math.cos(angle) * distance;
                const offsetY = Math.sin(angle) * distance;
                
                // Apply GPU-accelerated positioning
                particle.style.left = (x + offsetX) + 'px';
                particle.style.top = (y + offsetY) + 'px';
                
                // Realistic blur based on particle type
                const blur = Math.random() * 4 + 2;
                particle.style.filter = `blur(${blur}px)`;
                
                // Add slight noise texture illusion
                if (Math.random() > 0.7) {
                    particle.style.boxShadow = `
                        inset 0 0 ${Math.random() * 5}px rgba(255, 255, 255, 0.1),
                        0 0 ${Math.random() * 8}px rgba(255, 255, 255, 0.05)
                    `;
                }
                
                document.body.appendChild(particle);
                
                // Store particle with realistic physics
                particles.push({
                    element: particle,
                    x: x + offsetX,
                    y: y + offsetY,
                    size: size,
                    velocityX: (Math.random() - 0.5) * 1.2 * intensity,
                    velocityY: (Math.random() - 0.5) * 1.2 * intensity - 0.8, // Natural upward drift
                    life: 1.0,
                    decay: Math.random() * 
                        (config.particleDecay.max - config.particleDecay.min) + 
                        config.particleDecay.min,
                    scale: 1.0,
                    rotation: Math.random() * 360,
                    turbulence: Math.random() * 0.1,
                    temperature: 0.7 + Math.random() * 0.3, // Hotter smoke rises faster
                    color: { r, g, b },
                    initialAlpha: alpha
                });
            }
            
            // Optimized animation loop
            function animate(currentTime) {
                // Frame rate limiting for performance
                if (currentTime - lastAnimationTime < frameInterval) {
                    rafId = requestAnimationFrame(animate);
                    return;
                }
                
                lastAnimationTime = currentTime;
                
                // Update all particles with realistic physics
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    
                    // Life decay
                    p.life -= p.decay;
                    
                    // Remove dead particles
                    if (p.life <= 0) {
                        if (p.element && document.body.contains(p.element)) {
                            document.body.removeChild(p.element);
                        }
                        particles.splice(i, 1);
                        continue;
                    }
                    
                    // Ultra-realistic physics simulation
                    
                    // 1. Buoyancy (hot air rises)
                    p.velocityY -= 0.02 * p.temperature;
                    
                    // 2. Air resistance
                    p.velocityX *= 0.985;
                    p.velocityY *= 0.985;
                    
                    // 3. Natural turbulence
                    p.velocityX += (Math.random() - 0.5) * p.turbulence;
                    p.velocityY += (Math.random() - 0.5) * p.turbulence;
                    
                    // 4. Temperature cooling over time
                    p.temperature *= 0.998;
                    
                    // Update position
                    p.x += p.velocityX;
                    p.y += p.velocityY;
                    
                    // Natural expansion as smoke dissipates
                    p.scale += 0.003;
                    
                    // Gentle rotation
                    p.rotation += p.velocityX * 0.2;
                    
                    // Apply transformations (GPU optimized)
                    p.element.style.transform = 
                        `translate3d(-50%, -50%, 0) scale(${p.scale}) rotate(${p.rotation}deg)`;
                    
                    // Update position
                    p.element.style.left = p.x + 'px';
                    p.element.style.top = p.y + 'px';
                    
                    // Ultra-realistic fading and color changes
                    const lifeRatio = p.life;
                    
                    // Smoke becomes more transparent and lighter as it dissipates
                    const currentAlpha = p.initialAlpha * lifeRatio * 0.8;
                    
                    // Color shifts to cooler tones as smoke cools
                    const colorShift = 0.3 + lifeRatio * 0.7;
                    const r = Math.min(255, p.color.r * colorShift);
                    const g = Math.min(255, p.color.g * colorShift);
                    const b = Math.min(255, p.color.b * (colorShift * 1.1)); // Shift toward blue
                    
                    p.element.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${currentAlpha})`;
                    
                    // Blur increases as smoke dissipates
                    const currentBlur = 2 + (1 - lifeRatio) * 6;
                    p.element.style.filter = `blur(${currentBlur}px)`;
                    
                    // Update opacity for browsers that don't support rgba opacity well
                    p.element.style.opacity = lifeRatio;
                }
                
                rafId = requestAnimationFrame(animate);
            }
            
            // Handle window resize
            function handleResize() {
                // Update any responsive settings if needed
                frameInterval = 1000 / config.framesPerSecond;
            }
            
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', handleResize);
            
            // Performance optimization: pause animation when page is not visible
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (rafId) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                } else {
                    if (!rafId) {
                        lastAnimationTime = performance.now();
                        rafId = requestAnimationFrame(animate);
                    }
                }
            });
            
            // Start animation
            lastAnimationTime = performance.now();
            rafId = requestAnimationFrame(animate);
            
            // Create initial subtle smoke for visual feedback
            setTimeout(() => {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = Math.random() * 50;
                        const x = centerX + Math.cos(angle) * radius;
                        const y = centerY + Math.sin(angle) * radius;
                        createSingleSmokeParticle(x, y, 0.8);
                    }, i * 50);
                }
            }, 300);
            
            // Click/tap creates a smoke puff (for testing and interaction)
            document.addEventListener('click', (e) => {
                createTouchSmoke(e.clientX, e.clientY, 8);
            });
        });
    </script>
</body>
</html>
